<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CyberNest: 3D corridor for learning networks, Linux and Git, in Uzbek, Russian, Tajik and English.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>CyberNest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D night corridor; floating top bar, bottom room rail, lesson panel slides in from the right (bottom sheet on phones). Single dark world by design. */
:root{
  --bg:#0b0d12; --surface:#131722; --surface-2:#1a1f2d; --line:#2a3144; --fg:#eef1f6; --muted:#9aa4b8;
  --net:#4ea8ff; --linux:#f4b43c; --git:#ff6b4a; --ok:#4fd18b; --bad:#ff7d7d;
  --wing:var(--net);
  --f-display:"Unbounded","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wing);outline-offset:2px}

/* top bar */
.topbar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;
  background:rgba(19,23,34,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.brand svg{flex:none}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.bar{width:64px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--net),var(--linux),var(--git));transition:width .4s}
.langs{display:flex;background:rgba(19,23,34,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:3px}
.langs button{border:0;background:none;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}

/* bottom rail */
.rail{position:fixed;z-index:15;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;pointer-events:none}
.rail-inner{display:flex;gap:14px;overflow-x:auto;max-width:100%;pointer-events:auto;
  background:rgba(19,23,34,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.wgroup{display:flex;flex-direction:column;gap:4px;flex:none}
.wgroup span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.wgroup div{display:flex;gap:5px}
.chip{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--f-mono);font-size:12px;font-weight:600;cursor:pointer;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;transition:transform .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--c)}
.chip::before{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.chip.done{background:var(--c);color:#0b0d12;border-color:var(--c)}
.chip.done::before{display:none}
.chip.here{outline:2px solid var(--c);outline-offset:2px}

/* lesson panel */
.panel{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  right:max(16px,env(safe-area-inset-right,0px));width:min(460px,calc(100vw - 32px));
  background:rgba(19,23,34,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;
  overflow-y:auto;overscroll-behavior:contain;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.pin{padding:22px 22px 26px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--wing);font-variant-numeric:tabular-nums}
.panel h2{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.2;text-wrap:balance}
.sec h3{margin:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.story{background:color-mix(in srgb,var(--wing) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--wing) 30%,transparent);
  border-radius:14px;padding:14px 16px;line-height:1.6;font-size:15px}
.story h3{color:var(--wing)}
.story p{margin:0}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pts li{position:relative;padding-left:18px;line-height:1.5;color:#d9dee8}
.pts li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--wing)}
.cmds{display:flex;flex-direction:column;gap:10px}
.cmd{background:#0d1017;border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.cmd code{font-family:var(--f-mono);font-size:13px;color:#f2f5fa;overflow-x:auto;white-space:pre;min-width:0;display:block;padding-bottom:2px}
.cmd code b{color:var(--wing);font-weight:600;user-select:none}
.cmd small{grid-column:1/-1;color:var(--muted);font-size:13px;line-height:1.4}
.copy{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;font-size:11px;padding:4px 8px;cursor:pointer;color:var(--muted);white-space:nowrap}
.copy:hover{color:var(--fg)}
.note{font-size:13.5px;line-height:1.55;color:#d9dee8;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.quiz p{margin:0 0 10px;font-weight:500;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--wing)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface-2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface-2))}
.verdict{margin-top:8px;font-size:13.5px;min-height:1.2em}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--wing);border-color:var(--wing);color:#0b0d12}
.close{position:sticky;top:0;float:right;margin:-8px -8px 0 0;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:16px;z-index:2}

/* intro */
.intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(11,13,18,.35),rgba(11,13,18,.88) 70%)}
.card{max-width:540px;width:100%;background:rgba(19,23,34,.9);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:28px 26px;display:flex;flex-direction:column;gap:18px}
.card h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,46px);letter-spacing:.01em;line-height:1}
.card h1 em{font-style:normal;background:linear-gradient(90deg,var(--net),var(--linux) 55%,var(--git));-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin:0;line-height:1.6;color:#d4d9e3;font-size:15.5px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;font-weight:500}
.route span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.route span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.route b{color:var(--muted);font-weight:400}
.enter{border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:16px;cursor:pointer;background:var(--fg);color:#0b0d12}
.enter:hover{background:#fff}
.ctrl{font-size:13px;color:var(--muted);line-height:1.5}
.card .langs{align-self:flex-start;background:var(--surface-2)}

/* hint + pad + toast */
.hint{position:fixed;z-index:16;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  background:rgba(19,23,34,.92);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.pad{position:fixed;z-index:16;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:none;flex-direction:column;gap:8px}
.pad button{width:54px;height:54px;border-radius:14px;border:1px solid var(--line);background:rgba(19,23,34,.85);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.pad{display:flex}}
.toast{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);background:var(--ok);color:#0b0d12;
  font-weight:600;border-radius:12px;padding:10px 16px;font-size:14px;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:720px){
  .panel{top:auto;bottom:0;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;
    height:64dvh;max-height:64vh;border-radius:18px 18px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel h2{font-size:20px}
  .pin{padding:18px 16px 22px}
  .brand{font-size:13px;padding:7px 10px}
  .bar{width:40px}
  .wgroup span{font-size:9px}
  .chip{width:32px;height:32px}
  .rail-inner{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<canvas id="scene" aria-label="3D corridor with lesson rooms"></canvas>

<header class="topbar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="2" width="14" height="17" rx="2" fill="none" stroke="#eef1f6" stroke-width="1.6"/><circle cx="13" cy="11" r="1.3" fill="#f4b43c"/></svg>
    <span>CYBERNEST</span>
    <span class="prog"><span class="bar"><i id="barFill"></i></span><span id="progTxt">0/10</span></span>
  </div>
  <div class="langs" id="langTop" role="group" aria-label="Language"></div>
</header>

<nav class="rail" aria-label="Rooms"><div class="rail-inner" id="rail"></div></nav>

<div class="hint" id="hint" hidden></div>
<div class="pad" id="pad">
  <button id="padF" aria-label="Forward">▲</button>
  <button id="padB" aria-label="Back">▼</button>
</div>

<aside class="panel" id="panel" aria-live="polite"><div class="pin" id="pin"></div></aside>

<div class="intro" id="intro">
  <div class="card">
    <div class="langs" id="langIntro" role="group" aria-label="Language"></div>
    <h1>Cyber<em>Nest</em></h1>
    <p id="introSub"></p>
    <div class="route" id="route"></div>
    <button class="enter" id="enterBtn"></button>
    <div class="ctrl" id="ctrlTxt"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const L=(ru,uz,tg,en)=>({ru,uz,tg,en});
const LANGS=[["uz","UZ"],["ru","RU"],["tg","TJ"],["en","EN"]];

const UI={
  sub:L("Иди по коридору и заходи в комнаты. Каждая комната — один урок с примером из жизни: сети, Linux, Git — до первого push на GitHub.",
        "Yo'lak bo'ylab yuring va xonalarga kiring. Har bir xona — hayotiy misolli bitta dars: tarmoq, Linux, Git — GitHub'ga birinchi push qilishgacha.",
        "Дар долон қадам занед ва ба утоқҳо дароед. Ҳар утоқ — як дарс бо мисоли ҳаётӣ: шабака, Linux, Git — то push-и аввал ба GitHub.",
        "Walk down the corridor and step into the rooms. Each room is one lesson with a real-life example: networks, Linux, Git, all the way to your first push to GitHub."),
  enter:L("Войти в здание","Binoga kirish","Ба бино даромадан","Enter the building"),
  ctrlDesk:L("W A S D или стрелки — ходить · тяни мышью — смотреть · клик по двери — войти",
             "W A S D yoki strelkalar — yurish · sichqonchani torting — qarash · eshikni bosing — kirish",
             "W A S D ё тирчаҳо — гаштан · бо муш кашед — нигоҳ кардан · ба дар клик — даромадан",
             "W A S D or arrow keys to walk · drag to look · click a door to enter"),
  ctrlTouch:L("Кнопки ▲▼ — ходить · проведи пальцем — смотреть · нажми на дверь или номер внизу — войти",
              "▲▼ tugmalari — yurish · barmoq bilan suring — qarash · eshikka yoki pastdagi raqamga bosing — kirish",
              "Тугмаҳои ▲▼ — гаштан · бо ангушт кашед — нигоҳ кардан · ба дар ё рақами поён пахш кунед — даромадан",
              "▲▼ to walk · swipe to look · tap a door or a number below to enter"),
  story:L("Пример из жизни","Hayotiy misol","Мисоли ҳаётӣ","Real-life example"),
  points:L("Главное","Asosiysi","Асосӣ","Key ideas"),
  cmds:L("Команды","Buyruqlar","Фармонҳо","Commands"),
  quiz:L("Проверь себя","O'zingizni tekshiring","Худро санҷед","Check yourself"),
  right:L("Верно! Комната пройдена.","To'g'ri! Xona o'tildi.","Дуруст! Утоқ гузашт.","Correct! Room complete."),
  wrong:L("Не совсем. Перечитай пример и попробуй ещё.","Unchalik emas. Misolni qayta o'qing va yana urinib ko'ring.","На он қадар. Мисолро боз хонед ва аз нав кӯшиш кунед.","Not quite. Reread the example and try again."),
  back:L("← В коридор","← Yo'lakka","← Ба долон","← Corridor"),
  next:L("Следующая комната →","Keyingi xona →","Утоқи навбатӣ →","Next room →"),
  copy:L("Копировать","Nusxa","Нусха","Copy"),
  copied:L("Скопировано","Nusxalandi","Нусха шуд","Copied"),
  room:L("Комната","Xona","Утоқ","Room"),
  hintDoor:L("Нажми E или кликни по двери, чтобы войти","Kirish uchun E ni bosing yoki eshikni bosing","Барои даромадан E-ро пахш кунед ё ба дар клик кунед","Press E or click the door to enter"),
  hintTouch:L("Нажми на дверь, чтобы войти","Kirish uchun eshikka bosing","Барои даромадан ба дар пахш кунед","Tap the door to enter"),
  finish:L("Все 10 комнат пройдены. Теперь ты умеешь отправлять проекты на GitHub!","Barcha 10 xona o'tildi. Endi siz loyihalarni GitHub'ga yubora olasiz!","Ҳамаи 10 утоқ гузашт. Акнун шумо лоиҳаҳоро ба GitHub фиристода метавонед!","All 10 rooms done. You can now push your projects to GitHub!"),
  finale:L("Финиш: git push","Marra: git push","Марра: git push","Finish line: git push"),
  wings:{net:L("Сети","Tarmoq","Шабака","Networks"),linux:L("Linux","Linux","Linux","Linux"),git:L("Git и GitHub","Git va GitHub","Git ва GitHub","Git & GitHub")}
};

const ROOMS=[
{wing:"net",prop:"network",
 title:L("Что такое сеть?","Tarmoq nima?","Шабака чист?","What is a network?"),
 story:L("Представь улицу с домами. У каждого дома свой адрес, чтобы почтальон знал, куда нести письмо. Сеть — это улица, компьютеры — дома, а IP-адрес — адрес дома. Домашний Wi‑Fi — одна маленькая улица, а Интернет — целый город из миллионов улиц.",
         "Uylar qatorlashgan ko'chani tasavvur qiling. Har bir uyning o'z manzili bor, shunda pochtachi xatni qayerga olib borishni biladi. Tarmoq — bu ko'cha, kompyuterlar — uylar, IP-manzil esa uyning manzili. Uydagi Wi‑Fi — bitta kichik ko'cha, Internet esa millionlab ko'chalardan iborat butun shahar.",
         "Кӯчаеро бо хонаҳо тасаввур кунед. Ҳар хона суроғаи худро дорад, то почтачӣ донад, ки мактубро куҷо барад. Шабака — ин кӯча, компютерҳо — хонаҳо, суроғаи IP бошад — суроғаи хона. Wi‑Fi-и хонагӣ як кӯчаи хурд аст, Интернет бошад — шаҳри бузург аз миллионҳо кӯча.",
         "Imagine a street of houses. Each house has its own address so the postman knows where to bring letters. A network is that street, computers are the houses, and the IP address is the house address. Your home Wi‑Fi is one small street; the Internet is a whole city of millions of streets."),
 points:L(["IP-адрес — адрес компьютера, например 192.168.1.15","Локальная сеть (LAN) — твоя домашняя или офисная улица","Интернет — улицы, соединённые между собой","MAC-адрес — как паспорт сетевой карты, он не меняется"],
          ["IP-manzil — kompyuterning manzili, masalan 192.168.1.15","Lokal tarmoq (LAN) — uyingiz yoki ofisingiz ko'chasi","Internet — bir-biriga ulangan ko'chalar","MAC-manzil — tarmoq kartasining pasporti kabi, u o'zgarmaydi"],
          ["Суроғаи IP — суроғаи компютер, масалан 192.168.1.15","Шабакаи маҳаллӣ (LAN) — кӯчаи хона ё идораи шумо","Интернет — кӯчаҳое, ки бо ҳам пайвастанд","Суроғаи MAC — мисли шиносномаи корти шабака, тағйир намеёбад"],
          ["IP address — the computer's address, e.g. 192.168.1.15","Local network (LAN) — your home or office street","Internet — many streets joined together","MAC address — like the network card's passport, it does not change"]),
 cmds:[["ip a",L("Показать мои IP-адреса (Linux)","Mening IP-manzillarimni ko'rsatish (Linux)","Суроғаҳои IP-и маро нишон медиҳад (Linux)","Show my IP addresses (Linux)")],
       ["ipconfig",L("То же самое в Windows","Windows'da xuddi shu","Ҳамин дар Windows","The same on Windows")],
       ["hostname -I",L("Короткий список IP","IP'larning qisqa ro'yxati","Рӯйхати кӯтоҳи IP","Short list of IPs")]],
 quiz:{q:L("На что больше всего похож IP-адрес?","IP-manzil eng ko'p nimaga o'xshaydi?","Суроғаи IP ба чӣ бештар монанд аст?","What is an IP address most like?"),
       o:L(["Адрес дома","Цвет дома","Имя хозяина"],["Uy manziliga","Uyning rangiga","Uy egasining ismiga"],["Ба суроғаи хона","Ба ранги хона","Ба номи соҳибхона"],["A house address","The colour of the house","The owner's name"])}},

{wing:"net",prop:"router",
 title:L("Роутер и DNS","Router va DNS","Роутер ва DNS","Router and DNS"),
 story:L("Роутер — это почтовое отделение твоей улицы: каждое письмо из дома проходит через него, и он знает, какая дорога ведёт в город. DNS — это список контактов в телефоне: ты нажимаешь «Мама», а телефон набирает номер. Ты пишешь google.com, а DNS находит его IP-адрес, например 142.250.74.14.",
         "Router — ko'changizning pochta bo'limi: uydan chiqadigan har bir xat undan o'tadi va u shaharga qaysi yo'l olib borishini biladi. DNS — telefoningizdagi kontaktlar ro'yxati: siz «Onam»ni bosasiz, telefon raqamni teradi. Siz google.com deb yozasiz, DNS uning IP-manzilini topadi, masalan 142.250.74.14.",
         "Роутер — шӯъбаи почтаи кӯчаи шумост: ҳар мактубе, ки аз хона мебарояд, аз он мегузарад ва он медонад, ки кадом роҳ ба шаҳр мебарад. DNS — рӯйхати тамосҳо дар телефони шумост: шумо «Модар»-ро пахш мекунед, телефон рақамро мегирад. Шумо google.com менависед, DNS суроғаи IP-и онро меёбад, масалан 142.250.74.14.",
         "The router is the post office of your street: every letter leaving your home passes through it, and it knows which road leads to the city. DNS is the contacts list on your phone: you tap “Mom” and the phone dials the number. You type google.com and DNS finds its IP address, like 142.250.74.14."),
 points:L(["Роутер — соединяет домашнюю сеть с Интернетом","Шлюз (gateway) — адрес роутера, часто 192.168.1.1","DNS — превращает имена (google.com) в IP-адреса","Без DNS пришлось бы запоминать цифры каждого сайта"],
          ["Router — uy tarmog'ini Internetga ulaydi","Shlyuz (gateway) — routerning manzili, ko'pincha 192.168.1.1","DNS — nomlarni (google.com) IP-manzillarga aylantiradi","DNS bo'lmasa, har bir saytning raqamlarini yodlashga to'g'ri kelardi"],
          ["Роутер — шабакаи хонагиро ба Интернет мепайвандад","Дарвоза (gateway) — суроғаи роутер, аксар вақт 192.168.1.1","DNS — номҳоро (google.com) ба суроғаҳои IP табдил медиҳад","Бе DNS шумо бояд рақамҳои ҳар сайтро аз ёд мекардед"],
          ["Router — joins your home network to the Internet","Gateway — the router's address, often 192.168.1.1","DNS — turns names (google.com) into IP addresses","Without DNS you would have to remember numbers for every site"]),
 cmds:[["ip route",L("Показать шлюз (куда уходит трафик)","Shlyuzni ko'rsatish (trafik qayerdan chiqadi)","Дарвозаро нишон медиҳад (трафик аз куҷо мебарояд)","Show the gateway (where traffic leaves)")],
       ["nslookup google.com",L("Узнать IP сайта через DNS","DNS orqali saytning IP'sini bilish","IP-и сайтро тавассути DNS фаҳмидан","Find a site's IP through DNS")],
       ["cat /etc/resolv.conf",L("Какой DNS-сервер спрашивает мой компьютер","Kompyuterim qaysi DNS-serverdan so'raydi","Компютерам аз кадом сервери DNS мепурсад","Which DNS server my computer asks")]],
 quiz:{q:L("Что делает DNS?","DNS nima qiladi?","DNS чӣ кор мекунад?","What does DNS do?"),
       o:L(["Превращает имя сайта в IP-адрес","Ускоряет Wi‑Fi","Хранит пароли"],["Sayt nomini IP-manzilga aylantiradi","Wi‑Fi'ni tezlashtiradi","Parollarni saqlaydi"],["Номи сайтро ба суроғаи IP табдил медиҳад","Wi‑Fi-ро тез мекунад","Паролҳоро нигоҳ медорад"],["Turns a site name into an IP address","Makes Wi‑Fi faster","Stores passwords"])}},

{wing:"net",prop:"ports",
 title:L("Порты и протоколы","Portlar va protokollar","Портҳо ва протоколҳо","Ports and protocols"),
 story:L("IP-адрес приводит тебя к зданию. Порт — номер кабинета внутри. В одном здании может быть банк в кабинете 443, почта в 25 и охрана в 22. Протокол — язык, на котором говорят в кабинете: в банке говорят на HTTPS, у охраны — на SSH.",
         "IP-manzil sizni binoga olib keladi. Port — bino ichidagi xonaning raqami. Bitta binoda 443-xonada bank, 25-xonada pochta, 22-xonada qorovulxona bo'lishi mumkin. Protokol — o'sha xonada gaplashiladigan til: bankda HTTPS tilida, qorovulxonada SSH tilida gaplashiladi.",
         "Суроғаи IP шуморо ба бино мебарад. Порт — рақами утоқ дар дохили он. Дар як бино метавонад дар утоқи 443 бонк, дар 25 почта ва дар 22 посбонхона бошад. Протокол — забонест, ки дар он утоқ гап мезананд: дар бонк бо HTTPS, дар посбонхона бо SSH.",
         "An IP address brings you to a building. A port is the office number inside it. One building can have a bank in office 443, a post office in 25 and a guard room in 22. A protocol is the language spoken in that office: the bank speaks HTTPS, the guard room speaks SSH."),
 points:L(["Порт — число от 0 до 65535","80 — HTTP (сайт без шифрования)","443 — HTTPS (сайт с замочком)","22 — SSH (удалённое управление сервером)","TCP — заказное письмо: доставка подтверждается. UDP — крик через двор: быстро, без проверки"],
          ["Port — 0 dan 65535 gacha bo'lgan son","80 — HTTP (shifrlanmagan sayt)","443 — HTTPS (qulfchali sayt)","22 — SSH (serverni masofadan boshqarish)","TCP — buyurtma xat: yetkazilgani tasdiqlanadi. UDP — hovli orqali qichqiriq: tez, lekin tekshiruvsiz"],
          ["Порт — рақам аз 0 то 65535","80 — HTTP (сайт бе рамзгузорӣ)","443 — HTTPS (сайт бо қулф)","22 — SSH (идоракунии дурдасти сервер)","TCP — мактуби супоришӣ: расидан тасдиқ мешавад. UDP — фарёд аз болои ҳавлӣ: зуд, бе санҷиш"],
          ["Port — a number from 0 to 65535","80 — HTTP (website without encryption)","443 — HTTPS (website with a padlock)","22 — SSH (remote control of a server)","TCP — a registered letter: delivery is confirmed. UDP — a shout across the yard: fast, no check"]),
 cmds:[["ss -tuln",L("Какие порты открыты на моём компьютере","Kompyuterimda qaysi portlar ochiq","Дар компютерам кадом портҳо кушодаанд","Which ports are open on my computer")],
       ["curl -I https://github.com",L("Постучаться в порт 443 и прочитать заголовки ответа","443-portni taqillatib, javob sarlavhalarini o'qish","Порти 443-ро тақ-тақ кардан ва сарлавҳаҳои ҷавобро хондан","Knock on port 443 and read the reply headers")],
       ["nc -zv github.com 22",L("Проверить, открыт ли порт 22","22-port ochiqligini tekshirish","Санҷидан, ки порти 22 кушода аст","Check whether port 22 is open")]],
 quiz:{q:L("Какой порт обычно использует HTTPS?","HTTPS odatda qaysi portdan foydalanadi?","HTTPS одатан кадом портро истифода мебарад?","Which port does HTTPS usually use?"),
       o:L(["443","22","25"],["443","22","25"],["443","22","25"],["443","22","25"])}},

{wing:"net",prop:"ping",
 title:L("Ping и traceroute","Ping va traceroute","Ping ва traceroute","Ping and traceroute"),
 story:L("Ping — как позвать друга по имени в тёмном коридоре: «Ты здесь?» — «Да!» — и ты замеряешь, сколько шёл ответ. Traceroute — как спрашивать на каждом перекрёстке: «На какой я сейчас улице?» Так видно весь путь до сайта и место, где он застревает.",
         "Ping — qorong'i yo'lakda do'stingizni ismini aytib chaqirishga o'xshaydi: «Shu yerdamisan?» — «Ha!» — va javob qancha vaqtda kelganini o'lchaysiz. Traceroute — yo'ldagi har bir chorrahada «Hozir qaysi ko'chadaman?» deb so'rashga o'xshaydi. Shunda saytgacha bo'lgan butun yo'lni va qayerda tiqilib qolganini ko'rasiz.",
         "Ping — мисли он аст, ки дар долони торик дӯстатонро бо ном ҷеғ занед: «Дар ин ҷоӣ?» — «Ҳа!» — ва чен мекунед, ки ҷавоб чӣ қадар вақт гирифт. Traceroute — мисли он ки дар ҳар чорроҳа пурсед: «Ҳоло дар кадом кӯчаам?» Ҳамин тавр тамоми роҳро то сайт ва ҷои дармондани онро мебинед.",
         "Ping is like calling a friend's name in a dark corridor: “Are you there?” — “Yes!” — and you time how long the answer took. Traceroute is like asking at every crossroads: “Which street am I on now?” That way you see the whole route to a site and where it gets stuck."),
 points:L(["ping — проверяет, отвечает ли компьютер и как быстро (мс)","time=20 ms — хорошо; 300 ms — медленно; нет ответа — проблема или блокировка","traceroute — показывает каждый роутер (хоп) по пути","ping 8.8.8.8 работает, а ping google.com нет → проблема в DNS"],
          ["ping — kompyuter javob beradimi va qanchalik tez (ms), shuni tekshiradi","time=20 ms — yaxshi; 300 ms — sekin; javob yo'q — muammo yoki bloklangan","traceroute — yo'ldagi har bir routerni (hop) ko'rsatadi","ping 8.8.8.8 ishlaydi, ping google.com ishlamaydi → muammo DNS'da"],
          ["ping — месанҷад, ки компютер ҷавоб медиҳад ва чӣ қадар зуд (ms)","time=20 ms — хуб; 300 ms — суст; ҷавоб нест — мушкил ё баста","traceroute — ҳар роутерро (hop) дар роҳ нишон медиҳад","ping 8.8.8.8 кор мекунад, вале ping google.com не → мушкил дар DNS"],
          ["ping — checks whether a computer answers, and how fast (ms)","time=20 ms is good; 300 ms is slow; no answer means a problem or a block","traceroute — shows every router (hop) along the way","ping 8.8.8.8 works but ping google.com doesn't → DNS problem"]),
 cmds:[["ping -c 4 8.8.8.8",L("Отправить 4 пакета «ты здесь?»","4 ta «shu yerdamisan?» paketini yuborish","4 бастаи «дар ин ҷоӣ?» фиристодан","Send 4 “are you there?” packets")],
       ["ping -c 4 google.com",L("То же, но по имени (проверяет и DNS)","Xuddi shu, lekin nom bilan (DNS'ni ham tekshiradi)","Ҳамин, вале бо ном (DNS-ро ҳам месанҷад)","Same, but by name (also tests DNS)")],
       ["traceroute google.com",L("Показать маршрут по шагам (в Windows: tracert)","Yo'lni qadamma-qadam ko'rsatish (Windows'da: tracert)","Роҳро қадам ба қадам нишон додан (дар Windows: tracert)","Show the route step by step (Windows: tracert)")]],
 quiz:{q:L("ping 8.8.8.8 работает, а ping google.com — нет. Где скорее всего проблема?","ping 8.8.8.8 ishlaydi, lekin ping google.com ishlamaydi. Muammo ko'proq qayerda?","ping 8.8.8.8 кор мекунад, вале ping google.com не. Мушкил бештар дар куҷост?","ping 8.8.8.8 works, but ping google.com doesn't. Where is the problem most likely?"),
       o:L(["В DNS","В сетевом кабеле","В мониторе"],["DNS'da","Tarmoq kabelida","Monitorda"],["Дар DNS","Дар кабели шабака","Дар монитор"],["DNS","The network cable","The monitor"])}},

{wing:"linux",prop:"terminal",
 title:L("Linux и терминал","Linux va terminal","Linux ва терминал","Linux and the terminal"),
 story:L("Linux — это само здание: стены, электричество, лифты. Терминал — домофон к управляющему зданием. Вместо того чтобы ходить и кликать, ты говоришь точно, что нужно: «покажи комнаты», «сделай новую комнату». Управляющий делает это сразу и никогда не устаёт.",
         "Linux — binoning o'zi: devorlar, elektr, liftlar. Terminal — bino boshqaruvchisiga ulangan domofon. Yurib, sichqoncha bilan bosish o'rniga, nima kerakligini aniq aytasiz: «xonalarni ko'rsat», «yangi xona qil». Boshqaruvchi buni darhol bajaradi va hech qachon charchamaydi.",
         "Linux — худи бино аст: деворҳо, барқ, лифтҳо. Терминал — домофон ба мудири бино. Ба ҷои гаштан ва клик кардан, шумо аниқ мегӯед, ки чӣ лозим: «утоқҳоро нишон деҳ», «утоқи нав соз». Мудир инро фавран иҷро мекунад ва ҳеҷ гоҳ хаста намешавад.",
         "Linux is the building itself: walls, electricity, elevators. The terminal is the intercom to the building manager. Instead of walking around and clicking, you say exactly what you want: “show me the rooms”, “build a new room”. The manager does it at once and never gets tired."),
 points:L(["На Linux работают большинство серверов, телефоны Android и суперкомпьютеры","Дистрибутивы: Ubuntu, Debian, Fedora — одно здание, разный интерьер","Терминал (shell, bash) — ты пишешь команды, компьютер отвечает","$ в начале строки значит «жду твою команду»","Нет Linux? В Windows поставь WSL: wsl --install"],
          ["Ko'pchilik serverlar, Android telefonlar va superkompyuterlar Linux'da ishlaydi","Distributivlar: Ubuntu, Debian, Fedora — bitta bino, har xil interyer","Terminal (shell, bash) — siz buyruq yozasiz, kompyuter javob beradi","Qator boshidagi $ «buyrug'ingizni kutyapman» degani","Linux yo'qmi? Windows'da WSL o'rnating: wsl --install"],
          ["Аксари серверҳо, телефонҳои Android ва суперкомпютерҳо дар Linux кор мекунанд","Дистрибутивҳо: Ubuntu, Debian, Fedora — як бино, дохилаи гуногун","Терминал (shell, bash) — шумо фармон менависед, компютер ҷавоб медиҳад","$ дар аввали сатр яъне «фармони шуморо интизорам»","Linux надоред? Дар Windows WSL насб кунед: wsl --install"],
          ["Most servers, Android phones and supercomputers run Linux","Distributions: Ubuntu, Debian, Fedora — same building, different interior","Terminal (shell, bash) — you type commands, the computer answers","$ at the start of a line means “waiting for your command”","No Linux? Install WSL on Windows: wsl --install"]),
 cmds:[["whoami",L("Кто я в этом здании?","Bu binoda men kimman?","Ман дар ин бино кистам?","Who am I in this building?")],
       ["uname -a",L("Какой Linux и ядро","Qaysi Linux va yadro","Кадом Linux ва ядро","Which Linux and kernel")],
       ["sudo apt update",L("Обновить список программ (sudo = попросить ключом управляющего)","Dasturlar ro'yxatini yangilash (sudo = boshqaruvchi kaliti bilan so'rash)","Рӯйхати барномаҳоро нав кардан (sudo = бо калиди мудир пурсидан)","Refresh the list of programs (sudo = ask with the manager's key)")],
       ["man ls",L("Открыть инструкцию к любой команде","Istalgan buyruqning qo'llanmasini ochish","Дастури ҳар фармонро кушодан","Open the manual for any command")]],
 quiz:{q:L("Что означает sudo?","sudo nimani anglatadi?","sudo чӣ маъно дорад?","What does sudo mean?"),
       o:L(["Выполнить команду с правами администратора","Удалить файл","Выключить компьютер"],["Buyruqni administrator huquqlari bilan bajarish","Faylni o'chirish","Kompyuterni o'chirish"],["Фармонро бо ҳуқуқи администратор иҷро кардан","Файлро нест кардан","Компютерро хомӯш кардан"],["Run the command with administrator rights","Delete the file","Turn off the computer"])}},

{wing:"linux",prop:"tree",
 title:L("Файлы и папки","Fayllar va papkalar","Файлҳо ва ҷузвдонҳо","Files and folders"),
 story:L("Это как раз наш коридор. / (корень) — главный вход. /home/ali — квартира Али. pwd отвечает «где я стою?», ls — «осмотрись в комнате», cd — «пройди в дверь», а cd .. — «выйди назад в коридор».",
         "Bu aynan bizning yo'lagimiz. / (root) — asosiy kirish eshigi. /home/ali — Alining kvartirasi. pwd «qayerda turibman?» savoliga javob beradi, ls — «xonaga qarab chiq», cd — «eshikdan kir», cd .. esa — «yo'lakka qaytib chiq».",
         "Ин маҳз долони мост. / (реша) — даромадгоҳи асосӣ. /home/ali — хонаи Алӣ. pwd ба савол «ман дар куҷо истодаам?» ҷавоб медиҳад, ls — «ба утоқ нигоҳ кун», cd — «аз дар даро», cd .. бошад — «ба долон баргард».",
         "This is exactly our corridor. / (root) is the main entrance. /home/ali is Ali's apartment. pwd answers “where am I standing?”, ls means “look around the room”, cd means “walk through a door”, and cd .. means “step back into the corridor”."),
 points:L(["/ — корень, начало всего","~ — твоя домашняя папка (/home/твоё_имя)",". — эта комната, .. — шаг назад","Linux различает регистр: File.txt и file.txt — разные файлы","Клавиша Tab дописывает имена за тебя"],
          ["/ — ildiz, hamma narsaning boshlanishi","~ — uy papkangiz (/home/ismingiz)",". — shu xona, .. — bir qadam orqaga","Linux katta-kichik harfni farqlaydi: File.txt va file.txt — boshqa-boshqa","Tab tugmasi nomlarni o'zi to'ldiradi"],
          ["/ — реша, ибтидои ҳама чиз","~ — ҷузвдони хонагии шумо (/home/номи_шумо)",". — ҳамин утоқ, .. — як қадам ба қафо","Linux ҳарфҳои калон ва хурдро фарқ мекунад: File.txt ва file.txt гуногунанд","Тугмаи Tab номҳоро худаш пурра мекунад"],
          ["/ — root, where everything starts","~ — your home folder (/home/your_name)",". — this room, .. — one step back","Linux is case-sensitive: File.txt and file.txt are different files","The Tab key finishes names for you"]),
 cmds:[["pwd",L("Где я?","Qayerdaman?","Ман дар куҷоям?","Where am I?")],
       ["ls -la",L("Осмотреться, включая скрытые файлы","Atrofga qarash, yashirin fayllar bilan","Ба атроф нигоҳ кардан, бо файлҳои пинҳонӣ","Look around, hidden files included")],
       ["cd /etc",L("Зайти в комнату /etc","/etc xonasiga kirish","Ба утоқи /etc даромадан","Walk into the /etc room")],
       ["cd ..",L("Шаг назад","Bir qadam orqaga","Як қадам ба қафо","One step back")],
       ["mkdir project",L("Построить новую комнату","Yangi xona qurish","Утоқи нав сохтан","Build a new room")],
       ["touch notes.txt",L("Создать пустой файл","Bo'sh fayl yaratish","Файли холӣ сохтан","Create an empty file")],
       ["cp notes.txt copy.txt",L("Копировать","Nusxalash","Нусха бардоштан","Copy")],
       ["mv copy.txt project/",L("Переместить или переименовать","Ko'chirish yoki nomini o'zgartirish","Кӯчондан ё номашро иваз кардан","Move or rename")],
       ["cat notes.txt",L("Прочитать файл","Faylni o'qish","Файлро хондан","Read a file")],
       ["rm notes.txt",L("Удалить (корзины нет!)","O'chirish (savat yo'q!)","Нест кардан (сабад нест!)","Delete (there is no trash bin!)")]],
 quiz:{q:L("Какая команда говорит, где ты сейчас?","Hozir qayerda ekaningizni qaysi buyruq aytadi?","Кадом фармон мегӯяд, ки шумо ҳоло дар куҷоед?","Which command tells you where you are now?"),
       o:L(["pwd","ls","rm"],["pwd","ls","rm"],["pwd","ls","rm"],["pwd","ls","rm"])}},

{wing:"linux",prop:"lock",
 title:L("Права доступа","Ruxsatlar","Иҷозатҳо","Permissions"),
 story:L("У каждой комнаты есть замок и три группы людей: хозяин (owner), семья (group) и гости (others). Каждому можно дать три ключа: r — заглянуть внутрь (чтение), w — двигать мебель (запись), x — войти или запустить (выполнение). -rwxr-x--- значит: у хозяина все ключи, семья может смотреть и входить, гости стоят снаружи.",
         "Har bir xonaning qulfi va uch guruh odami bor: egasi (owner), oilasi (group) va mehmonlar (others). Har biriga uchta kalit berish mumkin: r — ichkariga qarash (o'qish), w — mebelni surish (yozish), x — kirish yoki ishga tushirish (bajarish). -rwxr-x--- degani: egasida hamma kalit bor, oila qarashi va kirishi mumkin, mehmonlar tashqarida turadi.",
         "Ҳар утоқ қулф ва се гурӯҳи одамон дорад: соҳиб (owner), оила (group) ва меҳмонон (others). Ба ҳар кадом се калид додан мумкин: r — ба дарун нигоҳ кардан (хондан), w — мебелро ҷойиваз кардан (навиштан), x — даромадан ё иҷро кардан. -rwxr-x--- яъне: соҳиб ҳамаи калидҳоро дорад, оила нигоҳ карда ва даромада метавонад, меҳмонон берун меистанд.",
         "Every room has a lock and three groups of people: the owner, the family (group) and guests (others). Each can get three keys: r — look inside (read), w — move the furniture (write), x — walk in or run (execute). -rwxr-x--- means the owner has every key, the family can look and enter, and guests stay outside."),

{wing:"linux",prop:"key",
 title:L("SSH и ключи","SSH va kalitlar","SSH ва калидҳо","SSH and keys"),
 story:L("SSH — секретный тоннель в другое здание. Ты стоишь в своей комнате, а руки работают на сервере на другом конце света. Вместо пароля используется пара ключей: приватный ключ — настоящий ключ, он всегда в твоём кармане; публичный ключ — замок, который можно дать кому угодно. GitHub получает замок, ключ остаётся у тебя.",
         "SSH — boshqa binoga olib boruvchi maxfiy tunnel. Siz o'z xonangizda turasiz, qo'llaringiz esa dunyoning narigi chekkasidagi serverda ishlaydi. Parol o'rniga kalitlar jufti ishlatiladi: shaxsiy (private) kalit — haqiqiy kalit, u doim cho'ntagingizda; ochiq (public) kalit — istalgan odamga berish mumkin bo'lgan qulf. GitHub qulfni oladi, kalit sizda qoladi.",
         "SSH — нақби махфӣ ба бинои дигар. Шумо дар утоқи худ истодаед, вале дастонатон дар сервере дар он сари дунё кор мекунанд. Ба ҷои парол як ҷуфт калид истифода мешавад: калиди хусусӣ — калиди аслӣ, ҳамеша дар кисаи шумо; калиди ошкоро — қулфест, ки ба ҳар кас додан мумкин. GitHub қулфро мегирад, калид дар назди шумо мемонад.",
         "SSH is a secret tunnel to another building. You stand in your own room, but your hands work on a server on the other side of the world. Instead of a password you use a key pair: the private key is the real key and stays in your pocket; the public key is a lock you can hand to anyone. GitHub gets the lock, you keep the key."),
 points:L(["ssh user@server — открыть тоннель","id_ed25519 — приватный ключ, никому не показывай","id_ed25519.pub — публичный ключ, его можно дать GitHub и серверам","Добавь .pub ключ на GitHub: Settings → SSH and GPG keys → New SSH key"],

{wing:"git",prop:"commits",
 title:L("Git: точки сохранения","Git: saqlash nuqtalari","Git: нуқтаҳои захира","Git: save points"),
 story:L("Git — фотоальбом твоего проекта. Каждый коммит — фото всех файлов в один момент с короткой подписью. git add — выбрать, кто встанет в кадр, git commit — нажать на кнопку. Если завтра что-то сломаешь, открываешь альбом и возвращаешься к вчерашнему фото.",
         "Git — loyihangizning fotoalbomi. Har bir commit — bir lahzadagi barcha fayllarning qisqa izohli surati. git add — suratga kim tushishini tanlash, git commit — tugmani bosish. Ertaga biror narsani buzib qo'ysangiz, albomni ochib, kechagi suratga qaytasiz.",
         "Git — албоми аксҳои лоиҳаи шумост. Ҳар commit — акси ҳамаи файлҳо дар як лаҳза бо имзои кӯтоҳ. git add — интихоб, ки кӣ ба акс медарояд, git commit — пахш кардани тугма. Агар фардо чизеро вайрон кунед, албомро кушода ба акси дирӯза бармегардед.",
         "Git is a photo album for your project. Each commit is a photo of all your files at one moment, with a short caption. git add chooses who stands in the picture, git commit presses the shutter. If you break something tomorrow, you open the album and go back to yesterday's photo."),

          ["Repozitoriy (repo) — Git kuzatib turadigan loyiha papkasi","Ishchi papka → tayyorlash (git add) → tarix (git commit)","Yaxshi commit xabari nima o'zgarganini aytadi: «Kirish sahifasi qo'shildi»","Branch (shoxcha) — main'ni buzmasdan g'oyalarni sinab ko'radigan parallel yo'lak"],
          ["Репозиторий (repo) — ҷузвдони лоиҳа, ки Git онро назорат мекунад","Ҷузвдони корӣ → омодасозӣ (git add) → таърих (git commit)","Паёми хуби commit мегӯяд, ки чӣ тағйир ёфт: «Саҳифаи вуруд илова шуд»","Шоха (branch) — долони мувозӣ, ки дар он ғояҳоро бе вайрон кардани main месанҷед"],
          ["Repository (repo) — a project folder that Git watches","Working folder → staging (git add) → history (git commit)","A good commit message says what changed: “Add login page”","Branch — a parallel corridor where you try ideas without breaking main"]),
 cmds:[["git config --global user.name \"Your Name\"",L("Подписать свои фото (один раз)","Suratlaringizga imzo qo'yish (bir marta)","Ба аксҳоятон имзо гузоштан (як бор)","Sign your photos (once)")],

       ["git init",L("Начать альбом в этой папке","Shu papkada albom boshlash","Дар ҳамин ҷузвдон албом оғоз кардан","Start an album in this folder")],

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("itk-lang","uz"); if(!LANGS.some(l=>l[0]===lang)) lang="uz";
let done=new Set(); try{done=new Set(JSON.parse(store.get("itk-done","[]")))}catch(e){}
const t=o=>o[lang]!=null?o[lang]:o.en;
const pad2=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>\x22]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse=matchMedia("(pointer: coarse)").matches;
const WING_HEX={net:0x4ea8ff,linux:0xf4b43c,git:0xff6b4a};
const WING_CSS={net:"#4ea8ff",linux:"#f4b43c",git:"#ff6b4a"};

/* ---------- three setup ---------- */
const canvas=document.getElementById("scene");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0d12);
scene.fog=new THREE.Fog(0x0b0d12,9,40);
const camera=new THREE.PerspectiveCamera(70,1,0.05,100);
camera.rotation.order="YXZ";
scene.add(new THREE.HemisphereLight(0xc8d6ff,0x1a1a26,0.5));

const CW=6,CH=3.6,Z0=3,ZEND=-37,RD=5,RW=5,DW=1.6,DH=2.6;
const roomZ=i=>-(6+i*3), roomSide=i=>i%2===0?-1:1;
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:.05},o));
const glow=(c,e=.4)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,roughness:.4,metalness:.2});
const basic=c=>new THREE.MeshBasicMaterial({color:c});
function add(geo,mat,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m}

function tileTexture(base,lineC){const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
  g.fillStyle=base;g.fillRect(0,0,128,128);g.strokeStyle=lineC;g.lineWidth=3;g.strokeRect(0,0,128,128);
  const tx=new THREE.CanvasTexture(c);tx.wrapS=tx.wrapT=THREE.RepeatWrapping;return tx}

/* labels (canvas textures that re-draw on language change) */
const labels=[];
function label(w,h,pw,ph,draw){const c=document.createElement("canvas");c.width=pw;c.height=ph;const g=c.getContext("2d");
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  const L={c,g,tex,draw,mesh};labels.push(L);redraw(L);return mesh}
function redraw(L){L.g.clearRect(0,0,L.c.width,L.c.height);L.draw(L.g,L.c.width,L.c.height);L.tex.needsUpdate=true}
function fitText(g,text,maxW,size,weight,family){let s=size;do{g.font=`${weight} ${s}px ${family}`;s-=2}while(g.measureText(text).width>maxW&&s>10);}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const FD='"Unbounded","Rubik",sans-serif',FB='"Rubik",sans-serif',FM='"JetBrains Mono",monospace';

/* corridor shell */
const LEN=Z0-ZEND, ZMID=(Z0+ZEND)/2;
const floorTex=tileTexture("#1a1e29","#232836");floorTex.repeat.set(CW/1.5,LEN/1.5);
const floor=add(new THREE.PlaneGeometry(CW,LEN),std(0xffffff,{map:floorTex,roughness:.55}),0,0,ZMID);floor.rotation.x=-Math.PI/2;
const ceil=add(new THREE.PlaneGeometry(CW,LEN),std(0x12151d),0,CH,ZMID);ceil.rotation.x=Math.PI/2;
const endWall=add(new THREE.PlaneGeometry(CW,CH),std(0x232838),0,CH/2,ZEND);
const startWall=add(new THREE.PlaneGeometry(CW,CH),std(0x232838),0,CH/2,Z0);startWall.rotation.y=Math.PI;
const wallMat=std(0x252b3a);

// wing guide strips on the floor

/* ---------- camera / movement ---------- */
const cam={x:0,z:1.6,yaw:0,pitch:-.02};
let mode="intro",current=null,busy=false,tween=null,viewK=0,nearDoor=null;
const keys=new Set();
function tweenTo(to,dur){return new Promise(res=>{const from={...cam};let dy=to.yaw-from.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  tween={from,to:{...to,yaw:from.yaw+dy},dur:reduce?Math.min(dur,.12):dur,t:0,res}})}
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const faceYaw=s=>s<0?Math.PI/2:-Math.PI/2;

async function walkToDoor(i){const s=roomSide(i),zc=roomZ(i);const tx=s*1.0;const dx=tx-cam.x,dz=zc-cam.z,d=Math.hypot(dx,dz);
  if(d>1.2){await tweenTo({x:cam.x,z:cam.z,yaw:Math.atan2(-dx,-dz),pitch:0},.3);await tweenTo({x:tx,z:zc,yaw:Math.atan2(-dx,-dz),pitch:0},.35+d*.085)}
  await tweenTo({x:tx,z:zc,yaw:faceYaw(s),pitch:0},.4)}
async function enterRoom(i){if(busy)return;busy=true;hideIntro();setHint(null);
  if(mode==="room"&&current!==null){if(current===i){busy=false;return}closePanel();await leaveRoom(false)}
  mode="moving";markRail(i);await walkToDoor(i);doors[i].target=doors[i].open;await wait(380);
  const s=roomSide(i);await tweenTo({x:s*(CW/2+.55),z:roomZ(i),yaw:faceYaw(s),pitch:-.07},.9);
  mode="room";current=i;openPanel(i);busy=false}
async function leaveRoom(turn=true){const i=current,s=roomSide(i);mode="moving";
  await tweenTo({x:s*1.0,z:roomZ(i),yaw:faceYaw(s),pitch:0},.8);doors[i].target=0;current=null;
  if(turn)await tweenTo({x:s*.6,z:roomZ(i),yaw:0,pitch:-.02},.5);mode="corridor";markRail(null)}
async function exitRoom(){if(busy||mode!=="room")return;busy=true;closePanel();await leaveRoom(true);busy=false}

/* input */
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;const k=e.key.toLowerCase();
  if(mode==="intro"&&(k==="enter")){startWalk();return}
  if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){keys.add(k);if(k.startsWith("arrow")&&mode==="corridor")e.preventDefault()}
  if(k==="e"&&mode==="corridor"&&nearDoor!=null)enterRoom(nearDoor);
  if(k==="escape"&&mode==="room")exitRoom()});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
addEventListener("blur",()=>keys.clear());
let drag=null;const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.moved=true;
  if(!tween&&(mode==="corridor"||mode==="room")){cam.yaw+=dx*.005;cam.pitch=Math.max(-.9,Math.min(.9,cam.pitch+dy*.004))}});
canvas.addEventListener("pointerup",e=>{if(drag&&!drag.moved)clickAt(e.clientX,e.clientY);drag=null});
canvas.addEventListener("pointercancel",()=>drag=null);
function clickAt(x,y){if(mode==="intro"){startWalk();return}if(mode!=="corridor")return;const r=canvas.getBoundingClientRect();
  ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(clickables,false)[0];if(hit&&hit.distance<24)enterRoom(hit.object.userData.room)}
function hold(btn,key){const on=e=>{e.preventDefault();keys.add(key)},off=()=>keys.delete(key);
  btn.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,off))}
hold(document.getElementById("padF"),"w");hold(document.getElementById("padB"),"s");

function renderRail(){const groups={net:[],linux:[],git:[]};ROOMS.forEach((r,i)=>groups[r.wing].push(i));
  $("rail").innerHTML=Object.entries(groups).map(([w,ids])=>`<div class="wgroup"><span>${esc(t(UI.wings[w]))}</span><div>${ids.map(i=>
    `<button class="chip${done.has(i)?" done":""}${current===i?" here":""}" style="--c:${WING_CSS[w]}" data-i="${i}" title="${esc(t(ROOMS[i].title))}" aria-label="${esc(t(UI.room)+" "+(i+1)+": "+t(ROOMS[i].title))}">${done.has(i)?"✓":pad2(i+1)}</button>`).join("")}</div></div>`).join("");
  $("barFill").style.width=(done.size/ROOMS.length*100)+"%";$("progTxt").textContent=`${done.size}/${ROOMS.length}`}
$("rail").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)enterRoom(+b.dataset.i)});
function markRail(i){document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("here",+c.dataset.i===i))}

function renderPanel(i,keepScroll){const r=ROOMS[i];const css=WING_CSS[r.wing];panel.style.setProperty("--wing",css);document.documentElement.style.setProperty("--wing",css);
  const order=[0,1,2].map(k=>(k+i)%3);const st=panel.scrollTop;
  pin.innerHTML=`
  <div><button class="close" id="xBtn" aria-label="${esc(t(UI.back))}">✕</button>
    <div class="eyebrow">${esc(t(UI.room))} ${pad2(i+1)} · ${esc(t(UI.wings[r.wing]))}</div><h2>${esc(t(r.title))}</h2></div>
  <section class="sec story"><h3>${esc(t(UI.story))}</h3><p>${esc(t(r.story))}</p></section>
  <section class="sec"><h3>${esc(t(UI.points))}</h3><ul class="pts">${t(r.points).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>
  <section class="sec"><h3>${esc(t(UI.cmds))}</h3><div class="cmds">${r.cmds.map(([c,d],k)=>`<div class="cmd"><code><b>$ </b>${esc(c)}</code><button class="copy" data-k="${k}">${esc(t(UI.copy))}</button><small>${esc(t(d))}</small></div>`).join("")}</div></section>
  ${r.note?`<div class="note">${esc(t(r.note))}</div>`:""}
  <section class="sec quiz"><h3>${esc(t(UI.quiz))}</h3><p>${esc(t(r.quiz.q))}</p><div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(t(r.quiz.o)[k])}</button>`).join("")}</div>
    <div class="verdict${done.has(i)?" ok":""}" id="verdict">${done.has(i)?esc(t(UI.right)):""}</div></section>
  <div class="nav"><button class="btn" id="backBtn">${esc(t(UI.back))}</button>${i<ROOMS.length-1?`<button class="btn primary" id="nextBtn">${esc(t(UI.next))}</button>`:""}</div>`;
  if(keepScroll)panel.scrollTop=st;else panel.scrollTop=0;
  $("xBtn").onclick=exitRoom;$("backBtn").onclick=exitRoom;if($("nextBtn"))$("nextBtn").onclick=()=>enterRoom(i+1);
  pin.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{const txt=r.cmds[+b.dataset.k][0];const ok=()=>{b.textContent=t(UI.copied);setTimeout(()=>b.textContent=t(UI.copy),1400)};
    try{navigator.clipboard.writeText(txt).then(ok,()=>selectCode(b))}catch(e){selectCode(b)}});
  pin.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const v=$("verdict");pin.querySelectorAll(".opt").forEach(o=>o.classList.remove("wrong"));
    if(+b.dataset.k===0){b.classList.add("right");v.className="verdict ok";v.textContent=t(UI.right);
      if(!done.has(i)){done.add(i);store.set("itk-done",JSON.stringify([...done]));redraw(labels[labels.indexOf(labels.find(L=>L.mesh===doorLabels[i]))]);renderRail();markRail(i);
        if(done.size===ROOMS.length)showToast(t(UI.finish),5000)}}
    else{b.classList.add("wrong");v.className="verdict no";v.textContent=t(UI.wrong)}})}
function selectCode(b){const code=b.previousElementSibling;const rg=document.createRange();rg.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(rg)}
function openPanel(i){renderPanel(i);panel.classList.add("open")}
function closePanel(){panel.classList.remove("open")}
function setHint(i,force){if(i===nearDoor&&!force)return;nearDoor=i;if(i==null){hint.hidden=true;return}
  hint.textContent=`${pad2(i+1)} · ${t(ROOMS[i].title)} — ${t(coarse?UI.hintTouch:UI.hintDoor)}`;hint.hidden=false}
let toastT;function showToast(msg,ms=2000){toast.textContent=msg;toast.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toast.hidden=true,ms)}
function hideIntro(){$("intro").hidden=true;if(mode==="intro")mode="corridor"}
function startWalk(){if(mode!=="intro")return;hideIntro();cam.yaw=0;cam.pitch=-.02;canvas.focus&&canvas.focus()}
$("enterBtn").onclick=startWalk;

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);applyView(w,h)}
function applyView(w=innerWidth,h=innerHeight){
  if(viewK<.001){camera.clearViewOffset();camera.aspect=w/h;camera.updateProjectionMatrix();return}
  const narrow=w<=720;
  if(narrow){const S=panel.offsetHeight*.92*viewK;camera.aspect=w/(h+S);camera.setViewOffset(w,h+S,0,S,w,h)}
  else{const P=(panel.offsetWidth+16)*viewK;camera.aspect=(w+P)/h;camera.setViewOffset(w+P,h,P,0,w,h)}
  camera.updateProjectionMatrix()}
addEventListener("resize",resize);
const clock=new THREE.Clock();let T=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);T+=dt;
  if(tween){tween.t+=dt;const k=ease(Math.min(tween.t/tween.dur,1));const{from:f,to}=tween;
    cam.x=f.x+(to.x-f.x)*k;cam.z=f.z+(to.z-f.z)*k;cam.yaw=f.yaw+(to.yaw-f.yaw)*k;cam.pitch=f.pitch+(to.pitch-f.pitch)*k;
    if(tween.t>=tween.dur){const r=tween.res;tween=null;r()}}
  else if(mode==="corridor"){
    const sp=3.2*dt,ts=1.8*dt;let fw=0,st=0;
    if(keys.has("w")||keys.has("arrowup"))fw+=1;if(keys.has("s")||keys.has("arrowdown"))fw-=1;
    if(keys.has("a"))st-=1;if(keys.has("d"))st+=1;
    if(keys.has("arrowleft"))cam.yaw+=ts;if(keys.has("arrowright"))cam.yaw-=ts;
    const sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
    cam.x+=(-sy*fw+cy*st)*sp;cam.z+=(-cy*fw-sy*st)*sp;
    cam.x=Math.max(-(CW/2-.4),Math.min(CW/2-.4,cam.x));cam.z=Math.max(ZEND+.6,Math.min(Z0-.5,cam.z));
    let near=null,best=9;ROOMS.forEach((_,i)=>{const s=roomSide(i),dz=Math.abs(cam.z-roomZ(i));if(dz<1.3&&s*cam.x>-.4&&dz<best){best=dz;near=i}});
    setHint(near);
    if(near!=null&&(fw||st)){const s=roomSide(near);if(s*cam.x>CW/2-.55&&Math.abs(cam.z-roomZ(near))<DW/2-.15)enterRoom(near)}
  } else if(mode==="intro"){cam.yaw=Math.sin(T*.25)*.35;cam.z=1.6}
  if(mode!=="corridor"&&nearDoor!=null)setHint(null);
  camera.position.set(cam.x,1.62+(mode==="corridor"&&(keys.size)?Math.sin(T*9)*.02:0),cam.z);
  camera.rotation.y=cam.yaw;camera.rotation.x=cam.pitch;
  doors.forEach(d=>{d.angle+=(d.target-d.angle)*Math.min(1,dt*5);d.pivot.rotation.y=d.angle});
  const vt=panel.classList.contains("open")?1:0;const nv=viewK+(vt-viewK)*Math.min(1,dt*4);if(Math.abs(nv-viewK)>1e-4||(vt===0&&viewK!==0&&nv<.001)){viewK=nv<.001?0:nv;applyView()}
  props.forEach(p=>p.update(reduce?T*.2:T));
  renderer.render(scene,camera);requestAnimationFrame(frame)}

renderStatic();resize();
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load(`700 40px Unbounded`),document.fonts.load(`600 40px Rubik`),document.fonts.load(`500 40px Rubik`),document.fonts.load(`600 40px "JetBrains Mono"`)]).then(()=>labels.forEach(redraw)).catch(()=>{})}
requestAnimationFrame(frame);
</script>
